version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: avatarstudio
      POSTGRES_PASSWORD: avatarstudio
      POSTGRES_DB: avatarstudio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatarstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
